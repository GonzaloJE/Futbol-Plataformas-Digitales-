<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidos del Abuelo</title>
<style>
  :root {
    --azul: #0b3d91;
    --rojo: #c8102e;
    --gris: #555;
    --borde: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    max-width: 820px;
    margin: 0 auto;
    padding: 16px;
    color: #222;
    background: #fafafa;
  }
  h1 {
    color: var(--azul);
    text-align: center;
    margin-bottom: 4px;
    font-size: 1.6em;
  }
  .subtitulo {
    text-align: center;
    color: var(--gris);
    margin-bottom: 20px;
    font-size: 0.9em;
  }
  .botones {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  button {
    background: var(--azul);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 1em;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.rojo { background: var(--rojo); }

  /* Filtro de horario */
  .filtro-horario {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    font-size: 0.9em;
    color: var(--gris);
  }
  .filtro-horario select {
    padding: 5px 8px;
    border-radius: 5px;
    border: 1px solid var(--borde);
    font-size: 0.95em;
  }
  .filtro-horario button {
    padding: 5px 10px;
    font-size: 0.85em;
    background: #eee;
    color: #333;
  }

  .filtro-plataformas {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    font-size: 0.85em;
    color: var(--gris);
  }
  .filtro-plataformas label {
    display: flex;
    align-items: center;
    gap: 4px;
    background: white;
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 3px 10px;
    cursor: pointer;
  }
  .filtro-plataformas input {
    cursor: pointer;
  }

  /* Encabezado de día: rediseñado, ya no es un bloque azul sólido */
  .dia {
    margin-bottom: 24px;
  }
  .dia h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    color: var(--azul);
    border-bottom: 2px solid var(--azul);
    padding-bottom: 5px;
    font-size: 1.05em;
    text-transform: capitalize;
    margin-bottom: 8px;
  }
  .dia h2 .fecha-num {
    font-size: 0.8em;
    color: var(--gris);
    font-weight: normal;
  }

  /* Fila de partido: estilo tabla, orden horario, logos a ambos lados */
  .partido {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    align-items: center;
    gap: 10px;
    background: white;
    border: 1px solid var(--borde);
    border-left: 4px solid var(--rojo);
    border-radius: 6px;
    padding: 8px 12px;
    margin-bottom: 6px;
  }
  .partido .hora {
    font-weight: bold;
    color: var(--rojo);
    font-size: 0.95em;
    text-align: center;
  }
  .logo-competicion {
    width: 16px;
    height: 16px;
    object-fit: contain;
    margin-top: 2px;
  }
  .partido .equipos {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-weight: 600;
    font-size: 1em;
  }
  .partido .equipos .vs {
    font-weight: 400;
    color: var(--gris);
    font-size: 0.85em;
  }
  .logo-equipo {
    width: 22px;
    height: 22px;
    object-fit: contain;
    vertical-align: middle;
    flex-shrink: 0;
  }
  .partido .canales {
    color: var(--gris);
    font-size: 0.78em;
    text-align: right;
    white-space: normal;
    max-width: 160px;
  }

  .vacio {
    text-align: center;
    color: var(--gris);
    padding: 40px 10px;
  }

  /* Calendario mensual */
  .cal-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }
  .cal-nav h2 {
    color: var(--azul);
    text-transform: capitalize;
    margin: 0;
    font-size: 1.2em;
    min-width: 180px;
    text-align: center;
  }
  .calendario-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 20px;
  }
  .cal-header {
    font-weight: bold;
    text-align: center;
    background: var(--azul);
    color: white;
    padding: 4px 2px;
    border-radius: 4px;
    font-size: 0.75em;
  }
  .cal-dia {
    border: 1px solid var(--borde);
    border-radius: 6px;
    min-height: 78px;
    padding: 3px;
    font-size: 0.68em;
    background: white;
  }
  .cal-dia.cal-vacia {
    background: transparent;
    border: none;
  }
  .cal-dia .num {
    font-weight: bold;
    color: var(--gris);
    margin-bottom: 2px;
    font-size: 0.95em;
  }
  .cal-nota {
    background: #fdeceb;
    border-left: 3px solid var(--rojo);
    border-radius: 3px;
    padding: 1px 3px;
    margin-bottom: 2px;
    line-height: 1.15;
    overflow: hidden;
  }
  .cal-nota img {
    width: 10px;
    height: 10px;
    vertical-align: middle;
    margin-right: 2px;
  }

  @media print {
    body { background: white; max-width: 100%; }
    .botones, .filtro-horario, .filtro-plataformas { display: none; }
    .cal-nav button { display: none; }
    .dia h2 { border-bottom-color: #000; color: #000; }
    .partido { border-left-color: #000; break-inside: avoid; }
    .semana-oculta { display: none; }
    .cal-header { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
    .cal-dia { break-inside: avoid; border-color: #000; }
    .cal-nota { border-left-color: #000; background: #f5f5f5 !important; -webkit-print-color-adjust: exact; }
  }
</style>
</head>
<body>

<h1>⚽ Programación de Partidos</h1>
<div class="subtitulo">Solo los partidos que puedes ver: Disney+, DGO/TNT Sports, ESPN y TyC Sports</div>

<div class="botones">
  <button onclick="mostrarTodo()">Ver todos</button>
  <button onclick="mostrarSemana()">Ver solo esta semana</button>
  <button onclick="mostrarCalendarioMesActual()">📅 Ver por mes</button>
  <button class="rojo" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
</div>

<div class="filtro-horario">
  Horario:
  <select id="horaDesde"></select>
  a
  <select id="horaHasta"></select>
  <button onclick="aplicarFiltroHorario()">Aplicar</button>
  <button onclick="limpiarFiltroHorario()">Quitar filtro</button>
</div>

<div class="filtro-plataformas" id="filtroPlataformas"></div>

<div id="contenido">Cargando...</div>

<script>
let datos = [];
let filtroHoraDesde = null; // minutos desde medianoche, o null = sin filtro
let filtroHoraHasta = null;

// Mapa de respaldo: se usa SOLO si el scraper no trajo el escudo del equipo
// (por ejemplo, en el partido que se detecta por texto en vez de tabla).
// La fuente principal de los logos ahora es automática: el scraper toma el
// escudo directo de futbolenvivochile.com para cualquier equipo que aparezca,
// sin tener que descargar ni mantener imágenes a mano.
const logosRespaldo = {
  "Colo Colo": "logo/colo-colo.webp",
  "Barcelona": "logo/barcelona.webp",
  "FC Barcelona": "logo/barcelona.webp",
  "Manchester City": "logo/man-city.webp",
  "Man City": "logo/man-city.webp",
  "Real Madrid": "logo/real-madrid.webp",
  "Liverpool": "logo/liverpool.webp",
  "Arsenal": "logo/arsenal.webp",
  "Manchester United": "logo/man-united.webp",
  "Manchester Utd.": "logo/man-united.webp",
  "Bayern Munich": "logo/bayern.webp",
  "FC Bayern": "logo/bayern.webp",
  "Real Betis": "logo/betis.webp",
  "Betis": "logo/betis.webp",
  "Inter de Milan": "logo/inter.webp",
  "Inter Milan": "logo/inter.webp",
  "Boca Juniors": "logo/boca.webp"
  // Nota: los equipos chilenos (U de Chile, Católica, Unión Española, etc.)
  // no necesitan entrada acá -> como ahora se sigue la LIGA completa,
  // el propio scraper trae el escudo automático de cada uno desde la tabla.
};

function obtenerLogoRespaldo(nombreEquipo) {
  return logosRespaldo[nombreEquipo] || null;
}

// Arma el HTML de un equipo dado su nombre y la url de logo que haya
// traído el propio partido (si el scraper la encontró).
function equipoHTML(nombre, logoDelPartido) {
  const logo = logoDelPartido || obtenerLogoRespaldo(nombre);
  const img = logo ? `<img src="${logo}" alt="${nombre}" class="logo-equipo" loading="lazy" onerror="this.style.display='none'">` : '';
  return `<span style="display:inline-flex; align-items:center; gap:4px;">${img}${nombre}</span>`;
}

function diaSemanaTexto(fechaStr) {
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const f = new Date(fechaStr + "T12:00:00");
  return {
    nombre: dias[f.getDay()],
    numero: `${f.getDate().toString().padStart(2,'0')}-${(f.getMonth()+1).toString().padStart(2,'0')}-${f.getFullYear()}`
  };
}

function inicioFinSemana() {
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const fin = new Date(hoy);
  fin.setDate(hoy.getDate() + 7);
  return [hoy, fin];
}

// Si el data.json trae el mismo partido repetido (mismos equipos + misma fecha),
// nos quedamos con uno solo, prefiriendo el que tenga más canales listados.
function quitarDuplicados(lista) {
  const vistos = new Map();
  lista.forEach(p => {
    const clave = (p.fecha || '') + '|' + [...p.equipos].sort().join('-');
    const existente = vistos.get(clave);
    if (!existente || (p.canales_abuelo || []).length > (existente.canales_abuelo || []).length) {
      vistos.set(clave, p);
    }
  });
  return Array.from(vistos.values());
}

function horaAMinutos(hora) {
  if (!hora) return null;
  const [h, m] = hora.split(':').map(Number);
  return h * 60 + m;
}

function pasaFiltroHorario(p) {
  if (filtroHoraDesde === null && filtroHoraHasta === null) return true;
  const mins = horaAMinutos(p.hora);
  if (mins === null) return true; // sin hora conocida, no lo ocultamos
  if (filtroHoraDesde !== null && mins < filtroHoraDesde) return false;
  if (filtroHoraHasta !== null && mins > filtroHoraHasta) return false;
  return true;
}

// ===== Filtro de plataformas (qué apps tiene el abuelo activas) =====
let plataformasSeleccionadas = null; // Set<string>, se llena al cargar los datos

function cargarPlataformasGuardadas() {
  try {
    const guardado = localStorage.getItem('plataformasSeleccionadas');
    return guardado ? new Set(JSON.parse(guardado)) : null;
  } catch (e) {
    return null;
  }
}

function guardarPlataformasSeleccionadas() {
  try {
    localStorage.setItem('plataformasSeleccionadas', JSON.stringify([...plataformasSeleccionadas]));
  } catch (e) { /* si falla, no pasa nada, solo no persiste */ }
}

function pasaFiltroPlataforma(p) {
  if (!plataformasSeleccionadas || plataformasSeleccionadas.size === 0) return true;
  return (p.canales_abuelo || []).some(c => plataformasSeleccionadas.has(c));
}

function armarFiltroPlataformas() {
  const todasLasPlataformas = new Set();
  datos.forEach(p => (p.canales_abuelo || []).forEach(c => todasLasPlataformas.add(c)));

  const guardadas = cargarPlataformasGuardadas();
  // Si no hay nada guardado todavía, partimos con todas marcadas
  plataformasSeleccionadas = guardadas || new Set(todasLasPlataformas);

  const cont = document.getElementById('filtroPlataformas');
  cont.innerHTML = 'Mis plataformas: ';
  [...todasLasPlataformas].sort().forEach(canal => {
    const id = 'plat-' + canal.replace(/[^a-zA-Z0-9]/g, '');
    const marcado = plataformasSeleccionadas.has(canal);
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" id="${id}" ${marcado ? 'checked' : ''}> ${canal}`;
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) plataformasSeleccionadas.add(canal);
      else plataformasSeleccionadas.delete(canal);
      guardarPlataformasSeleccionadas();
      if (vistaActual === 'calendario') renderCalendario();
      else render(vistaActual === 'semana');
    });
    cont.appendChild(label);
  });
}

function llenarSelectsHorario() {
  const desde = document.getElementById('horaDesde');
  const hasta = document.getElementById('horaHasta');
  desde.innerHTML = '<option value="">Cualquiera</option>';
  hasta.innerHTML = '<option value="">Cualquiera</option>';
  for (let h = 0; h < 24; h++) {
    const etiqueta = `${h.toString().padStart(2,'0')}:00`;
    desde.innerHTML += `<option value="${h*60}">${etiqueta}</option>`;
    hasta.innerHTML += `<option value="${h*60+59}">${etiqueta}</option>`;
  }
}

function aplicarFiltroHorario() {
  const desde = document.getElementById('horaDesde').value;
  const hasta = document.getElementById('horaHasta').value;
  filtroHoraDesde = desde === '' ? null : parseInt(desde, 10);
  filtroHoraHasta = hasta === '' ? null : parseInt(hasta, 10);
  if (vistaActual === 'calendario') renderCalendario();
  else render(vistaActual === 'semana');
}

function limpiarFiltroHorario() {
  filtroHoraDesde = null;
  filtroHoraHasta = null;
  document.getElementById('horaDesde').value = '';
  document.getElementById('horaHasta').value = '';
  if (vistaActual === 'calendario') renderCalendario();
  else render(vistaActual === 'semana');
}

let vistaActual = 'semana';

function render(soloSemana) {
  vistaActual = soloSemana ? 'semana' : 'todos';
  const cont = document.getElementById('contenido');
  cont.innerHTML = '';

  let lista = quitarDuplicados(datos).filter(pasaFiltroHorario).filter(pasaFiltroPlataforma);
  if (soloSemana) {
    const [inicio, fin] = inicioFinSemana();
    lista = lista.filter(p => {
      if (!p.fecha) return false;
      const f = new Date(p.fecha + "T12:00:00");
      return f >= inicio && f <= fin;
    });
  }

  if (lista.length === 0) {
    cont.innerHTML = '<div class="vacio">No hay partidos disponibles con ese filtro por ahora.</div>';
    return;
  }

  const porDia = {};
  lista.forEach(p => {
    const key = p.fecha || 'Sin fecha';
    if (!porDia[key]) porDia[key] = [];
    porDia[key].push(p);
  });

  Object.keys(porDia).sort().forEach(fecha => {
    // Orden estrictamente horario dentro del día
    porDia[fecha].sort((a, b) => (horaAMinutos(a.hora) ?? 9999) - (horaAMinutos(b.hora) ?? 9999));

    const divDia = document.createElement('div');
    divDia.className = 'dia';
    if (fecha !== 'Sin fecha') {
      const { nombre, numero } = diaSemanaTexto(fecha);
      divDia.innerHTML = `<h2>${nombre} <span class="fecha-num">${numero}</span></h2>`;
    } else {
      divDia.innerHTML = `<h2>Fecha por confirmar</h2>`;
    }

    porDia[fecha].forEach(p => {
      const div = document.createElement('div');
      div.className = 'partido';
      const logos = p.logos || [null, null];
      const eq1 = equipoHTML(p.equipos[0], logos[0]);
      const eq2 = equipoHTML(p.equipos[1], logos[1]);
      div.innerHTML = `
        <div class="hora">
          ${p.hora || '--:--'}
          ${p.competicion_logo ? `<br><img src="${p.competicion_logo}" class="logo-competicion" alt="${p.competicion || ''}" title="${p.competicion || ''}" onerror="this.style.display='none'">` : ''}
        </div>
        <div class="equipos">${eq1}<span class="vs">vs</span>${eq2}</div>
        <div class="canales">📺 ${p.canales_abuelo.join(', ')}</div>
      `;
      divDia.appendChild(div);
    });

    cont.appendChild(divDia);
  });
}

function mostrarTodo() { render(false); }
function mostrarSemana() { render(true); }

// ===== Vista de calendario mensual =====
let mesVista = new Date();
mesVista.setDate(1);

const NOMBRES_MES = ["enero","febrero","marzo","abril","mayo","junio",
  "julio","agosto","septiembre","octubre","noviembre","diciembre"];

function generarCeldasMes(anio, mes) {
  const primerDia = new Date(anio, mes, 1);
  const ultimoDia = new Date(anio, mes + 1, 0);
  const diasEnMes = ultimoDia.getDate();
  const inicioSemana = primerDia.getDay(); // 0 = domingo
  const celdas = [];
  for (let i = 0; i < inicioSemana; i++) celdas.push(null);
  for (let d = 1; d <= diasEnMes; d++) celdas.push(d);
  while (celdas.length % 7 !== 0) celdas.push(null);
  return celdas;
}

function renderCalendario() {
  vistaActual = 'calendario';
  const cont = document.getElementById('contenido');
  cont.innerHTML = '';

  const anio = mesVista.getFullYear();
  const mes = mesVista.getMonth();

  const nav = document.createElement('div');
  nav.className = 'cal-nav';
  nav.innerHTML = `
    <button onclick="cambiarMesCalendario(-1)">◀</button>
    <h2>${NOMBRES_MES[mes]} ${anio}</h2>
    <button onclick="cambiarMesCalendario(1)">▶</button>
  `;
  cont.appendChild(nav);

  const lista = quitarDuplicados(datos).filter(pasaFiltroHorario).filter(pasaFiltroPlataforma);
  const porFecha = {};
  lista.forEach(p => {
    if (!p.fecha) return;
    if (!porFecha[p.fecha]) porFecha[p.fecha] = [];
    porFecha[p.fecha].push(p);
  });

  const grid = document.createElement('div');
  grid.className = 'calendario-grid';

  ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"].forEach(nombreDia => {
    const h = document.createElement('div');
    h.className = 'cal-header';
    h.textContent = nombreDia;
    grid.appendChild(h);
  });

  const celdas = generarCeldasMes(anio, mes);
  celdas.forEach(diaNum => {
    const celda = document.createElement('div');
    if (diaNum === null) {
      celda.className = 'cal-dia cal-vacia';
      grid.appendChild(celda);
      return;
    }
    celda.className = 'cal-dia';
    const fechaKey = `${anio}-${String(mes + 1).padStart(2,'0')}-${String(diaNum).padStart(2,'0')}`;
    let html = `<div class="num">${diaNum}</div>`;
    (porFecha[fechaKey] || []).sort((a, b) => (horaAMinutos(a.hora) ?? 9999) - (horaAMinutos(b.hora) ?? 9999)).forEach(p => {
      const logos = p.logos || [null, null];
      const logoUno = logos[0] || obtenerLogoRespaldo(p.equipos[0]);
      const logoDos = logos[1] || obtenerLogoRespaldo(p.equipos[1]);
      const logoMostrar = logoUno || logoDos;
      const img = logoMostrar ? `<img src="${logoMostrar}" onerror="this.style.display='none'">` : '';
      html += `<div class="cal-nota">${img}<b>${p.hora || ''}</b> ${p.equipos.join(' vs ')}</div>`;
    });
    celda.innerHTML = html;
    grid.appendChild(celda);
  });

  cont.appendChild(grid);
}

function cambiarMesCalendario(delta) {
  mesVista.setMonth(mesVista.getMonth() + delta);
  renderCalendario();
}

function mostrarCalendarioMesActual() {
  mesVista = new Date();
  mesVista.setDate(1);
  renderCalendario();
}

llenarSelectsHorario();

fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(json => {
    datos = json.partidos || [];
    armarFiltroPlataformas();
    mostrarSemana(); // por defecto muestra la semana, para imprimir rápido
  })
  .catch(e => {
    document.getElementById('contenido').innerHTML =
      '<div class="vacio">No se pudo cargar la programación todavía.</div>';
  });
</script>

</body>
</html>

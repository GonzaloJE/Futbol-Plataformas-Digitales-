<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partidos del Abuelo</title>
<style>
  :root {
    --azul: #0b3d91;
    --rojo: #c8102e;
    --gris: #555;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
    color: #222;
    background: #fafafa;
  }
  h1 {
    color: var(--azul);
    text-align: center;
    margin-bottom: 4px;
    font-size: 1.6em;
  }
  .subtitulo {
    text-align: center;
    color: var(--gris);
    margin-bottom: 20px;
    font-size: 0.9em;
  }
  .botones {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  button {
    background: var(--azul);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 1em;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.rojo { background: var(--rojo); }
  .dia {
    margin-bottom: 22px;
  }
  .dia h2 {
    background: var(--azul);
    color: white;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 1.05em;
    text-transform: capitalize;
    margin-bottom: 8px;
  }
  .partido {
    background: white;
    border: 1px solid #ddd;
    border-left: 5px solid var(--rojo);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }
  .partido .hora {
    font-weight: bold;
    color: var(--rojo);
    margin-right: 8px;
  }
  .partido .equipos {
    font-weight: 600;
    font-size: 1.05em;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .logo-equipo {
    width: 22px;
    height: 22px;
    object-fit: contain;
    vertical-align: middle;
  }
  .partido .canales {
    color: var(--gris);
    font-size: 0.9em;
    margin-top: 4px;
  }
  .vacio {
    text-align: center;
    color: var(--gris);
    padding: 40px 10px;
  }
  .actualizado {
    text-align: center;
    color: #999;
    font-size: 0.8em;
    margin-top: 30px;
  }

  @media print {
    body { background: white; max-width: 100%; }
    .botones { display: none; }
    .dia h2 { background: #eee !important; color: #000 !important; -webkit-print-color-adjust: exact; }
    .partido { border-left-color: #000; break-inside: avoid; }
    .semana-oculta { display: none; }
  }
</style>
</head>
<body>

<h1>⚽ Programación de Partidos</h1>
<div class="subtitulo">Solo los partidos que puedes ver: Disney+, DGO/TNT Sports, ESPN y TyC Sports</div>

<div class="botones">
  <button onclick="mostrarTodo()">Ver todos</button>
  <button onclick="mostrarSemana()">Ver solo esta semana</button>
  <button class="rojo" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
</div>

<div id="contenido">Cargando...</div>
<div class="actualizado" id="actualizado"></div>

<script>
let datos = [];

// Mapa de nombre de equipo (tal como aparece en data.json) -> URL del escudo.
// Si el scraper usa nombres distintos (ej. "Man City" en vez de "Manchester City"),
// agrega esa variante como otra clave apuntando al mismo link.
const logosEquipos = {
  "Colo Colo": "https://upload.wikimedia.org/wikipedia/en/9/9c/Colo-Colo_logo.png",

  "Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.png",
  "FC Barcelona": "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.png",

  "Manchester City": "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg",
  "Man City": "https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg",

  "Real Madrid": "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg",

  "Liverpool": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",
  "Liverpool FC": "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg",

  "Arsenal": "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg",
  "Arsenal FC": "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg",

  "Manchester United": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",
  "Man United": "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg",

  "Bayern Munich": "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg",
  "Bayern München": "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg",
  "FC Bayern Múnich": "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg",

  "Betis": "https://upload.wikimedia.org/wikipedia/en/1/13/Real_betis_logo.svg",
  "Real Betis": "https://upload.wikimedia.org/wikipedia/en/1/13/Real_betis_logo.svg",

  "Inter de Milan": "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg",
  "Inter Milan": "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg",
  "Inter de Milán": "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg",
  "Inter": "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg",

  "Boca Juniors": "https://upload.wikimedia.org/wikipedia/commons/0/0c/CABJ70.png"
};

function obtenerLogo(nombreEquipo) {
  return logosEquipos[nombreEquipo] || null;
}

// Arma el HTML de un equipo: escudo (si existe) + nombre
function equipoHTML(nombre) {
  const logo = obtenerLogo(nombre);
  const img = logo ? `<img src="${logo}" alt="${nombre}" class="logo-equipo" loading="lazy" onerror="this.style.display='none'">` : '';
  return `<span style="display:inline-flex; align-items:center; gap:4px;">${img}${nombre}</span>`;
}

function diaSemanaTexto(fechaStr) {
  const dias = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  const f = new Date(fechaStr + "T12:00:00");
  return `${dias[f.getDay()]} ${f.getDate().toString().padStart(2,'0')}-${(f.getMonth()+1).toString().padStart(2,'0')}-${f.getFullYear()}`;
}

function inicioFinSemana() {
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const fin = new Date(hoy);
  fin.setDate(hoy.getDate() + 7);
  return [hoy, fin];
}

function render(soloSemana) {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '';

  let lista = datos;
  if (soloSemana) {
    const [inicio, fin] = inicioFinSemana();
    lista = datos.filter(p => {
      if (!p.fecha) return false;
      const f = new Date(p.fecha + "T12:00:00");
      return f >= inicio && f <= fin;
    });
  }

  if (lista.length === 0) {
    cont.innerHTML = '<div class="vacio">No hay partidos disponibles en este rango por ahora.</div>';
    return;
  }

  const porDia = {};
  lista.forEach(p => {
    const key = p.fecha || 'Sin fecha';
    if (!porDia[key]) porDia[key] = [];
    porDia[key].push(p);
  });

  Object.keys(porDia).sort().forEach(fecha => {
    const divDia = document.createElement('div');
    divDia.className = 'dia';
    const titulo = fecha !== 'Sin fecha' ? diaSemanaTexto(fecha) : 'Fecha por confirmar';
    divDia.innerHTML = `<h2>${titulo}</h2>`;

    porDia[fecha].forEach(p => {
      const div = document.createElement('div');
      div.className = 'partido';
      const equiposHTML = p.equipos.map(equipoHTML).join(' <span style="font-weight:400;">vs</span> ');
      div.innerHTML = `
        <div><span class="hora">${p.hora || '--:--'}</span></div>
        <div class="equipos">${equiposHTML}</div>
        <div class="canales">📺 ${p.canales_abuelo.join(', ')}</div>
      `;
      divDia.appendChild(div);
    });

    cont.appendChild(divDia);
  });
}

function mostrarTodo() { render(false); }
function mostrarSemana() { render(true); }

fetch('data.json?_=' + Date.now())
  .then(r => r.json())
  .then(json => {
    datos = json.partidos || [];
    document.getElementById('actualizado').textContent =
      'Última actualización: ' + new Date(json.generado).toLocaleString('es-CL');
    mostrarSemana(); // por defecto muestra la semana, para imprimir rápido
  })
  .catch(e => {
    document.getElementById('contenido').innerHTML =
      '<div class="vacio">No se pudo cargar la programación todavía.</div>';
  });
</script>

</body>
</html>
